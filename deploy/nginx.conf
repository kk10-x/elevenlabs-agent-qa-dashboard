server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths return the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
